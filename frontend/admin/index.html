<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <title>Área do professor — AcodeAI</title>
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../assets/css/app.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="wrap">
        <a class="brand" href="../">AcodeAI</a>
        <a class="btn-quiet" href="../">Voltar ao tutor</a>
      </div>
    </header>

    <main class="thread wrap">
      <noscript><p class="error">Ative o JavaScript do navegador para usar esta página.</p></noscript>

      <form id="upload" class="panel" novalidate>
        <h1>Enviar material de estudo</h1>
        <p class="lead">Envie um PDF para o tutor usar nas respostas. Se você enviar o mesmo arquivo de novo, o conteúdo antigo é substituído.</p>

        <div>
          <label for="key">Chave de administrador</label>
          <input id="key" type="password" autocomplete="current-password" required />
          <p class="hint">A chave fica só nesta página e não é guardada no navegador.</p>
        </div>

        <div>
          <label for="file">Arquivo PDF</label>
          <label id="drop" class="drop" for="file">
            <strong id="drop-title">Escolha um PDF ou arraste até aqui</strong>
            <small id="drop-hint">Só PDFs com texto selecionável (digitalizados ainda não são lidos).</small>
          </label>
          <input id="file" class="sr-only" type="file" accept="application/pdf,.pdf" />
        </div>

        <div>
          <label for="subject">Matéria</label>
          <select id="subject" required></select>
        </div>

        <div>
          <label for="title">Título do material</label>
          <input id="title" type="text" maxlength="200" placeholder="Ex.: Cinemática - Cap. 1" required />
          <p class="hint">É o nome que o aluno vê nas fontes da resposta.</p>
        </div>

        <div id="status" role="status" aria-live="polite"></div>

        <div class="actions">
          <button id="submit" class="btn-primary" type="submit">Enviar e indexar</button>
        </div>
      </form>
    </main>

    <script src="../config.js"></script>
    <script type="module" src="../assets/js/admin.js"></script>
  </body>
</html>
