[project]
name = "acodeai"
version = "0.1.0"
description = "API do AcodeAI: tutor de vestibular com RAG (MongoDB Vector Search + Ollama)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "langchain-text-splitters>=1.1.2",
    "motor>=3.7.1",
    "openai>=3.13.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pymongo[srv]>=4.18.1",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.32.0",
]

[project.scripts]
acodeai = "acodeai:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.16.7",
]
